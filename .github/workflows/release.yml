name: Manual Build & Release

# 核心 1: 触发方式改为 workflow_dispatch (手动触发)
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      description:
        description: '更新说明'
        required: false
        default: '手动构建发布'

# 核心 2: 赋予写权限，否则无法创建 Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    # 1. 拉取代码
    - uses: actions/checkout@v4

    # 2. 准备 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安装依赖 (确保你的项目里有 requirements.txt)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # 4. PyInstaller 打包
    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --name "pptScanner" pptScaner.py

    # 5. 发布到 GitHub Releases
    # 使用 softprops/action-gh-release 插件
    - name: Create Release and Upload
      uses: softprops/action-gh-release@v1
      with:
        # 使用你手动输入的版本号作为 tag
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        body: ${{ github.event.inputs.description }}
        draft: false
        prerelease: false
        # 上传 dist 文件夹下的 exe 文件
        files: dist/PPT_Searcher.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
